<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>alert-flexibility · sign in</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fafafa; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 2rem 3rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>alert-flexibility</h1>
    <p>Sign in with Telegram to view and manage data-completeness gaps.</p>
    {% if bot_username %}
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="{{ bot_username }}"
      data-size="large"
      data-auth-url="/auth/telegram/callback"
      data-request-access="write">
    </script>
    {% else %}
    <p><em>TELEGRAM_BOT_USERNAME is not configured.</em></p>
    {% endif %}
  </div>
</body>
</html>
